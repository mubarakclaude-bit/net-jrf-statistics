name: T9 renewal-process validation

on:
  pull_request:
    branches: [gpt/stochastic-t8-branching-processes]
  push:
    branches: [gpt/stochastic-t9-renewal-processes]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-t9:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Verify exact arithmetic and mastery pool
        run: python verify_stochastic_t9.py
      - name: Validate lesson structure and pool
        run: node vcheck.js seed/lesson_stochastic_t9.json
      - name: Build app
        run: bash build.sh
      - name: Install browser-test dependency
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Run browser integration suite
        run: |
          node test.js
          node clicktest.js
