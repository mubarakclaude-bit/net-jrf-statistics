name: Lesson authoring pipeline

# Deterministic generation and validation only. No deployment or ArtifactData writes.
on:
  pull_request:
    branches: ["tooling/whats-next", "main"]
    paths:
      - "lesson_*.py"
      - "verify_*.py"
      - "seed/lesson_*.json"
      - "seed/*_mastery.json"
      - ".github/workflows/lesson-pipeline.yml"

permissions:
  contents: read

concurrency:
  group: lesson-pipeline-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  author-and-validate:
    if: startsWith(github.head_ref, 'lesson/')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install numerical verification dependency
        run: python -m pip install --upgrade pip numpy

      - name: Discover changed authoring script
        id: discover
        shell: bash
        run: |
          set -euo pipefail
          git diff --name-only "${{ github.event.pull_request.base.sha }}" HEAD > .cache_changed.txt
          grep -E '^lesson_[A-Za-z0-9_-]+\.py$' .cache_changed.txt > .lesson_scripts.txt || true
          cat .lesson_scripts.txt
          if [ -s .lesson_scripts.txt ]; then
            count=$(wc -l < .lesson_scripts.txt)
            [ "$count" -eq 1 ] || { echo "One lesson per PR is required; found $count"; exit 1; }
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Require and run matching numerical verifier
        if: steps.discover.outputs.found == 'true'
        shell: bash
        run: |
          set -euo pipefail
          grep -E '^verify_[A-Za-z0-9_-]+\.py$' .cache_changed.txt > .verifier_scripts.txt || true
          count=$(wc -l < .verifier_scripts.txt)
          [ "$count" -eq 1 ] || { echo "Exactly one changed verification script is required; found $count"; exit 1; }
          verifier=$(cat .verifier_scripts.txt)
          python "$verifier"

      - name: Generate and validate lesson seeds
        if: steps.discover.outputs.found == 'true'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p seed .cache
          author=$(cat .lesson_scripts.txt)
          out_path=$(grep -m1 '^OUT[[:space:]]*=' "$author" | cut -d '"' -f2)
          pool_path=$(grep -m1 '^POOL[[:space:]]*=' "$author" | cut -d '"' -f2)
          [[ "$out_path" =~ ^seed/[A-Za-z0-9_-]+\.json$ ]] || { echo "Invalid OUT path: $out_path"; exit 1; }
          [[ "$pool_path" =~ ^seed/[A-Za-z0-9_-]+\.json$ ]] || { echo "Invalid POOL path: $pool_path"; exit 1; }
          stem="${out_path#seed/}"; stem="${stem%.json}"
          pool="${pool_path#seed/}"; pool="${pool%.json}"
          rm -f "$out_path" "$pool_path"
          python "$author"
          test -s "$out_path"
          read -r topic doc < <(python -c 'import json,sys; d=json.load(open(sys.argv[1],encoding="utf-8")); print(d["topicId"],d["id"])' "$out_path")
          ./addlesson.sh "$author" "$stem" "$topic" "$doc" "$pool"

      - name: Check index and harness consistency
        if: steps.discover.outputs.found == 'true'
        run: ./check.sh

      - name: Build application
        if: steps.discover.outputs.found == 'true'
        run: ./build.sh

      - name: Install Playwright and Chromium
        if: steps.discover.outputs.found == 'true'
        run: |
          npm install --no-save --no-package-lock playwright
          npx playwright install --with-deps chromium

      - name: Run application tests
        if: steps.discover.outputs.found == 'true'
        run: |
          node test.js
          node clicktest.js

      - name: Upload generated review artifacts
        if: always() && steps.discover.outputs.found == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: lesson-candidate-${{ github.event.pull_request.number }}
          if-no-files-found: warn
          path: |
            seed/lesson_*.json
            seed/*_mastery.json
            seed/meta_lessons.json
            test.js
            .cache/

      - name: Publish pipeline summary
        if: always()
        shell: bash
        run: |
          {
            echo "## Lesson authoring pipeline"
            echo ""
            echo "- Branch: $GITHUB_HEAD_REF"
            echo "- Commit: $GITHUB_SHA"
            echo "- Lesson scripts detected: ${{ steps.discover.outputs.found || 'not evaluated' }}"
            echo "- This workflow does not deploy or write to ArtifactData."
          } >> "$GITHUB_STEP_SUMMARY"
