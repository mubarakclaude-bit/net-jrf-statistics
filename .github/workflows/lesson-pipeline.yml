name: Lesson authoring pipeline

# Generate and test lesson seeds in an isolated runner. Never deploy or write to ArtifactData.
on:
  pull_request:
    branches: ["tooling/whats-next", "main"]
    paths:
      - "lesson_*.py"
      - "verify_*.py"
      - "seed/lesson_*.json"
      - "seed/*_mastery.json"
      - ".github/workflows/lesson-pipeline.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lesson-pipeline-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  author-and-validate:
    if: startsWith(github.head_ref || github.ref_name, 'lesson/') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install numerical verification dependency
        run: python -m pip install --upgrade pip numpy

      - name: Discover changed authoring scripts
        id: discover
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git diff --name-only "${{ github.event.pull_request.base.sha }}" HEAD > .cache_changed.txt
          else
            git ls-files 'lesson_*.py' > .cache_changed.txt
          fi
          grep -E '^lesson_[A-Za-z0-9_-]+\.py$' .cache_changed.txt > .lesson_scripts.txt || true
          echo "Changed authoring scripts:"
          cat .lesson_scripts.txt
          if [ -s .lesson_scripts.txt ]; then echo "found=true" >> "$GITHUB_OUTPUT"; else echo "found=false" >> "$GITHUB_OUTPUT"; fi

      - name: Run numerical verification scripts
        if: steps.discover.outputs.found == 'true'
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r verifier; do
            [ -n "$verifier" ] && python "$verifier"
          done < <(grep -E '^verify_[A-Za-z0-9_-]+\.py$' .cache_changed.txt || true)

      - name: Generate and validate lesson seeds
        if: steps.discover.outputs.found == 'true'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p seed .cache
          while IFS= read -r author; do
            [ -n "$author" ] || continue
            stem=$(sed -n 's/^OUT[[:space:]]*=[[:space:]]*["'"']seed\/\([^"'"']*\)\.json["'"'][[:space:]]*$/\1/p' "$author")
            pool=$(sed -n 's/^POOL[[:space:]]*=[[:space:]]*["'"']seed\/\([^"'"']*\)\.json["'"'][[:space:]]*$/\1/p' "$author")
            [ -n "$stem" ] || { echo "Cannot read OUT seed stem from $author"; exit 1; }
            [ -n "$pool" ] || { echo "Cannot read POOL seed stem from $author"; exit 1; }
            python "$author"
            test -s "seed/$stem.json"
            read -r topic doc < <(python -c 'import json,sys; d=json.load(open(sys.argv[1],encoding="utf-8")); print(d["topicId"],d["id"])' "seed/$stem.json")
            ./addlesson.sh "$author" "$stem" "$topic" "$doc" "$pool"
          done < .lesson_scripts.txt

      - name: Check index and harness consistency
        if: steps.discover.outputs.found == 'true'
        run: ./check.sh

      - name: Build application
        if: steps.discover.outputs.found == 'true'
        run: ./build.sh

      - name: Install Playwright and Chromium
        if: steps.discover.outputs.found == 'true'
        run: |
          npm install --no-save --no-package-lock playwright
          npx playwright install --with-deps chromium

      - name: Run application tests
        if: steps.discover.outputs.found == 'true'
        run: |
          node test.js
          node clicktest.js

      - name: Publish pipeline summary
        if: always()
        shell: bash
        run: |
          {
            echo "## Lesson authoring pipeline"
            echo ""
            echo "- Branch: $GITHUB_HEAD_REF"
            echo "- Authoring scripts detected: ${{ steps.discover.outputs.found || 'not evaluated' }}"
            echo "- Runner validation does not deploy or write to ArtifactData."
          } >> "$GITHUB_STEP_SUMMARY"
