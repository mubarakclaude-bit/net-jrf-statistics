name: Seed and app validation

on:
  push:
    branches: ["**"]
    paths:
      - "seed/**"
      - "src/**"
      - "*.py"
      - "*.js"
      - "check.sh"
      - "build.sh"
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install pinned validation and browser dependencies
        run: npm ci
      - name: Check seed index and harness wiring
        run: |
          chmod +x ./check.sh ./build.sh
          ./check.sh
      - name: Validate DOE lessons and mastery pools
        run: |
          for topic in t1 t2 t3 t4 t5 t6 t7 t8; do
            echo "=== DOE ${topic} ==="
            node vcheck.js "seed/lesson_design_${topic}.json"
            python "lesson_design_${topic}.py"
            python "verify_design_${topic}.py"
          done
      - name: Validate Regression lessons and mastery pools
        run: |
          python tools/serialize_regression_batch.py --check
          for topic in $(seq 1 15); do
            echo "=== Regression T${topic} ==="
            node vcheck.js "seed/lesson_rg${topic}.json"
            python "verify_regression_t${topic}.py"
          done
      - name: Validate Stochastic Processes and Multivariate Analysis lessons and mastery pools
        run: |
          for topic in t1 t2 t3 t4 t5 t6 t7 t8 t9; do
            echo "=== Stochastic ${topic} ==="
            node vcheck.js "seed/lesson_stochastic_${topic}.json"
            python "verify_stochastic_${topic}.py"
            echo "=== Multivariate ${topic} ==="
            node vcheck.js "seed/lesson_multivariate_${topic}.json"
            python "verify_multivariate_${topic}.py"
          done
      - name: Validate Non-parametric lessons, mastery pools and numerical verifiers
        run: |
          if [ -f seed/lesson_nonparam_t1.json ]; then
            for topic in nonparam-t1 nonparam-t2 nonparam-t3 nonparam-t4 nonparam-t5 nonparam-t6 nonparam-t7 nonparam-t8; do
              echo "=== Non-parametric ${topic} ==="
              npm run lesson -- check "${topic}"
              number="${topic##*-t}"
              python -I "verify_nonparam_t${number}.py"
            done
          else
            echo "SKIP: Non-parametric release checks run when the module content PR is included."
          fi
      - name: Build app and check JavaScript syntax
        run: ./build.sh
      - name: Install browser test dependency
        run: npm install --no-save playwright
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run app integration suite
        run: node test.js
      - name: Run lesson interaction suite
        run: node clicktest.js
