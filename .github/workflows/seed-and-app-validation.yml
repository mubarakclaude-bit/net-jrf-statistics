name: Seed and app validation

on:
  push:
    branches: ["**"]
    paths:
      - "seed/**"
      - "src/**"
      - "*.py"
      - "*.js"
      - "check.sh"
      - "build.sh"
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install Node dependencies from lockfile
        run: npm ci
      - name: Check seed index and harness wiring
        run: |
          chmod +x ./check.sh ./build.sh
          ./check.sh
      - name: Validate DOE lessons and mastery pools
        run: |
          for topic in t1 t2 t3 t4 t5 t6 t7 t8; do
            echo "=== DOE ${topic} ==="
            node vcheck.js "seed/lesson_design_${topic}.json"
            python "lesson_design_${topic}.py"
            python "verify_design_${topic}.py"
          done
      - name: Build app and check JavaScript syntax
        run: ./build.sh
      - name: Install browser test dependency
        run: npm install --no-save playwright
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run app integration suite
        run: node test.js
      - name: Run lesson interaction suite
        run: node clicktest.js
