name: Question bank audit

on:
  push:
    branches:
      - "question-bank/**"
  workflow_dispatch:

jobs:
  structural-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Audit June 2026 PYQ and variant banks
        run: npm run audit:question-bank
