name: Mathematics package checks
on:
  push:
    branches: [gpt/mathematics-unit2-production]
    paths:
      - 'seed/lesson_ma2.json'
      - 'seed/maths_t2_mastery.json'
      - 'seed/lesson_ma3.json'
      - 'seed/lesson_ma5.json'
      - 'seed/lesson_ma6.json'
      - 'seed/lesson_ma7.json'
      - 'seed/lesson_ma8.json'
      - 'seed/lesson_ma9.json'
      - 'seed/lesson_ma10.json'
      - 'seed/lesson_ma11.json'
      - 'seed/lesson_ma12.json'
      - 'seed/lesson_ma13.json'
      - 'seed/lesson_ma14.json'
      - 'seed/lesson_ma15.json'
      - 'seed/lesson_ma16.json'
      - 'seed/maths_t15_mastery.json'
      - 'seed/maths_t16_mastery.json'
      - 'verify_mathst15.py'
      - 'verify_mathst16.py'
      - 'evidence/mathst15.md'
      - 'evidence/mathst16.md'
      - 'reports/mathst15-verification.md'
      - 'reports/mathst16-verification.md'
      - 'seed/lesson_ma15.json'
      - 'seed/maths_t15_mastery.json'
      - 'seed/maths_t14_mastery.json'
      - 'seed/maths_t13_mastery.json'
      - 'seed/maths_t12_mastery.json'
      - 'seed/maths_t11_mastery.json'
      - 'seed/maths_t10_mastery.json'
      - 'seed/maths_t9_mastery.json'
      - 'seed/maths_t8_mastery.json'
      - 'seed/maths_t7_mastery.json'
      - 'seed/maths_t6_mastery.json'
      - 'seed/maths_t5_mastery.json'
      - 'seed/maths_t3_mastery.json'
      - 'seed/meta_lessons.json'
      - 'test.js'
      - 'verify_mathst2.py'
      - 'verify_mathst3.py'
      - 'verify_mathst5.py'
      - 'verify_mathst6.py'
      - 'verify_mathst7.py'
      - 'verify_mathst8.py'
      - 'verify_mathst9.py'
      - 'verify_mathst10.py'
      - 'verify_mathst11.py'
      - 'verify_mathst12.py'
      - 'verify_mathst13.py'
      - 'verify_mathst14.py'
      - 'verify_mathst15.py'
      - '.github/workflows/mathst2-package.yml'
      - 'vcheck.js'
      - 'src/62-gen.js'
      - 'mathrender.js'
      - 'src/32-math.js'
      - 'check.sh'
      - 'build.sh'
  workflow_dispatch:
jobs:
  lesson-and-mastery:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Exact mathematical anchors and pool structure
        run: |
          python verify_mathst2.py
          python verify_mathst3.py
          python verify_mathst5.py
          python verify_mathst6.py
          python verify_mathst7.py
          python verify_mathst8.py
          python verify_mathst9.py
          python verify_mathst10.py
          python verify_mathst11.py
          python verify_mathst12.py
          python verify_mathst13.py
          python verify_mathst14.py
          python verify_mathst15.py
          python verify_mathst16.py
      - name: App scene schema validation
        run: |
          node vcheck.js seed/lesson_ma2.json
          node vcheck.js seed/lesson_ma3.json
          node vcheck.js seed/lesson_ma5.json
          node vcheck.js seed/lesson_ma6.json
          node vcheck.js seed/lesson_ma7.json
          node vcheck.js seed/lesson_ma8.json
          node vcheck.js seed/lesson_ma9.json
          node vcheck.js seed/lesson_ma10.json
          node vcheck.js seed/lesson_ma11.json
          node vcheck.js seed/lesson_ma12.json
          node vcheck.js seed/lesson_ma13.json
          node vcheck.js seed/lesson_ma14.json
          node vcheck.js seed/lesson_ma15.json
          node vcheck.js seed/lesson_ma16.json
      - name: Render every authored formula
        run: |
          mkdir -p .cache
          python - <<'PY'
          import json
          out=[]
          def walk(o):
              if isinstance(o,dict):
                  for k,v in o.items():
                      if k=='math' and isinstance(v,str): out.extend(x for x in v.split('\\n') if x.strip())
                      elif k=='body' and isinstance(v,str) and o.get('t') in ('formula','step','def'): out.extend(x for x in v.split('\\n') if x.strip())
                      else: walk(v)
              elif isinstance(o,list):
                  for x in o: walk(x)
          for p in ['seed/lesson_ma2.json','seed/lesson_ma3.json','seed/lesson_ma5.json','seed/lesson_ma6.json','seed/lesson_ma7.json','seed/lesson_ma8.json','seed/lesson_ma9.json','seed/lesson_ma10.json' ,'seed/lesson_ma11.json','seed/lesson_ma12.json','seed/lesson_ma13.json','seed/lesson_ma14.json','seed/lesson_ma15.json','seed/lesson_ma16.json']:
              walk(json.load(open(p,encoding='utf-8')))
          json.dump(out,open('.cache/math-formulas.json','w',encoding='utf-8'),ensure_ascii=False)
          PY
          node mathrender.js .cache/math-formulas.json .cache/math-rendered.json
          python - <<'PY'
          import json
          r=json.load(open('.cache/math-rendered.json',encoding='utf-8'))
          bad=[k for k,v in r.items() if not v.get('ok')]
          print(f'{len(r)} formula lines; {len(bad)} parser refusals')
          if bad: raise SystemExit('formula renderer refused: '+repr(bad[:5]))
          PY
      - name: Validate JSON syntax
        run: python -c "import json; [json.load(open(p, encoding='utf-8')) for p in ['seed/lesson_ma2.json','seed/maths_t2_mastery.json','seed/lesson_ma3.json','seed/maths_t3_mastery.json','seed/lesson_ma5.json','seed/maths_t5_mastery.json','seed/lesson_ma6.json','seed/maths_t6_mastery.json','seed/lesson_ma7.json','seed/maths_t7_mastery.json','seed/lesson_ma8.json','seed/maths_t8_mastery.json','seed/lesson_ma9.json','seed/maths_t9_mastery.json','seed/lesson_ma10.json','seed/maths_t10_mastery.json','seed/lesson_ma11.json','seed/maths_t11_mastery.json','seed/lesson_ma12.json','seed/maths_t12_mastery.json','seed/lesson_ma13.json','seed/maths_t13_mastery.json','seed/lesson_ma14.json','seed/maths_t14_mastery.json','seed/lesson_ma15.json','seed/maths_t15_mastery.json','seed/lesson_ma16.json','seed/maths_t16_mastery.json','seed/meta_lessons.json']]"
      - name: Verify lesson index and harness wiring
        run: bash check.sh
      - name: Build application
        run: bash build.sh
      - name: Run browser regression suite
        run: |
          npm init -y
          npm install --no-save playwright
          npx playwright install --with-deps chromium
          node test.js
