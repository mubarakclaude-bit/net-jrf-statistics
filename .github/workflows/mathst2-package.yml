name: Mathematics T2 package checks
on:
  push:
    branches: [gpt/mathematics-unit2-production]
    paths:
      - 'seed/lesson_ma2.json'
      - 'seed/maths_t2_mastery.json'
      - 'verify_mathst2.py'
      - '.github/workflows/mathst2-package.yml'
      - 'vcheck.js'
      - 'src/62-gen.js'
      - 'mathrender.js'
      - 'src/32-math.js'
  workflow_dispatch:
jobs:
  lesson-and-mastery:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Exact mathematical anchors and pool structure
        run: python verify_mathst2.py
      - name: App scene schema validation
        run: node vcheck.js seed/lesson_ma2.json
      - name: Render every authored formula
        run: |
          mkdir -p .cache
          python - <<'PY'
          import json
          L=json.load(open('seed/lesson_ma2.json',encoding='utf-8'))
          out=[]
          def walk(o):
              if isinstance(o,dict):
                  for k,v in o.items():
                      if k=='math' and isinstance(v,str): out.extend(x for x in v.split('\\n') if x.strip())
                      elif k=='body' and isinstance(v,str) and o.get('t') in ('formula','step','def'): out.extend(x for x in v.split('\\n') if x.strip())
                      else: walk(v)
              elif isinstance(o,list):
                  for x in o: walk(x)
          walk(L)
          json.dump(out,open('.cache/t2-math.json','w',encoding='utf-8'),ensure_ascii=False)
          PY
          node mathrender.js .cache/t2-math.json .cache/t2-rendered.json
          python - <<'PY'
          import json
          r=json.load(open('.cache/t2-rendered.json',encoding='utf-8'))
          bad=[k for k,v in r.items() if not v.get('ok')]
          print(f'{len(r)} formula lines; {len(bad)} parser refusals')
          if bad: raise SystemExit('formula renderer refused: '+repr(bad[:5]))
          PY
      - name: Validate JSON syntax
        run: python -c "import json; [json.load(open(p, encoding='utf-8')) for p in ['seed/lesson_ma2.json','seed/maths_t2_mastery.json']]"
