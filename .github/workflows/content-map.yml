name: Content map

# Rebuilds the content map from production after every merge and publishes it on the `content-map` branch, so an assistant
# that can only read the repository on GitHub (it cannot run commands) can still learn what content exists and what is
# missing. The branch holds only two generated files, CONTENT_MAP.md and content-map.json; nothing reads it back into the app.
#
# It runs only on the production branch (and by hand). The content-map branch is never merged and is not deployed (the
# Vercel Ignored Build Step skips every branch except production). Pushes made with the workflow token do not trigger other
# workflows, so this cannot loop. The same tool is checked on every pull request by `npm run check`.
on:
  push:
    branches: [multi-author-hosting]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: content-map
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Build the map
        run: node tools/content.js map --out "$RUNNER_TEMP/map"
      - name: Publish it on the content-map branch (replaced each time; no history is kept)
        run: |
          set -e
          mkdir "$RUNNER_TEMP/publish"
          cp "$RUNNER_TEMP/map/CONTENT_MAP.md" "$RUNNER_TEMP/map/content-map.json" "$RUNNER_TEMP/publish/"
          printf '%s\n' "# content-map branch" "" "Generated by .github/workflows/content-map.yml from commit ${GITHUB_SHA} of multi-author-hosting. Do not edit or merge this branch." "Read CONTENT_MAP.md first; content-map.json is the same data for tools." > "$RUNNER_TEMP/publish/README.md"
          cd "$RUNNER_TEMP/publish"
          git init -q -b content-map
          git config user.name "content-map workflow"
          git config user.email "content-map@users.noreply.github.com"
          git add -A
          git commit -q -m "Content map for ${GITHUB_SHA}"
          git remote add origin "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git"
          git push -q --force origin content-map
