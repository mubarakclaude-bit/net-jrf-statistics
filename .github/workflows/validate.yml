name: Validate

# CI uses only scripts that are present in this repository. Vercel deployment is deliberately separate.
on:
  pull_request:
  push:
    branches: ["**"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate seed JSON, manifest links and mastery-pool references
        run: bash check.sh
      - name: Identify changed lesson seeds
        id: changed
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE="${{ github.event.pull_request.base.sha }}"
          elif [ "${{ github.event_name }}" = "push" ]; then
            BASE="${{ github.event.before }}"
          else
            BASE=""
          fi
          if [ -n "$BASE" ] && git cat-file -e "$BASE" 2>/dev/null; then
            git diff --name-only --diff-filter=AM "$BASE" HEAD -- 'seed/lesson_*.json' > .changed.txt
          else
            : > .changed.txt
          fi
          echo "Changed lesson seeds:"; cat .changed.txt
      - name: App renderer and lesson structure validation
        run: |
          fail=0
          while read -r f; do
            [ -z "$f" ] && continue
            echo "::group::$f"
            node vcheck.js "$f" || fail=1
            echo "::endgroup::"
          done < .changed.txt
          exit "$fail"

  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install declared dependencies (repository currently has no lockfile)
        run: npm install --no-audit --no-fund
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Build the app bundle used by the browser suites
        run: bash build.sh
      - name: App integration suite
        run: node test.js
      - name: Lesson interaction suite
        run: node clicktest.js
