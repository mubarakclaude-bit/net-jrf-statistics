name: Validate

# The independent verification for every pull request, whoever or whatever wrote it. A PR cannot merge while this is red.
# Every step is a documented command (see AGENTS.md) that runs from a clean checkout with `npm ci`; nothing depends on
# one assistant's tools, prompts or session, and nothing needs the Claude artifact.
#
#   validate    contracts, fixtures, storage paths, EVERY lesson and question pool, and the generated lesson index;
#               plus the house-standard check (vcheck.js) on the lessons this PR changes
#   browser     builds the app and the hosted site, then runs test.js, clicktest.js, the hosted storage adapter, and
#               EVERY feature's own browser test (each feature in a fresh browser, in strict storage-path mode)
#   acceptance  the independence test, six scenarios on a scratch copy (docs/INDEPENDENCE.md):
#                 S1 two authors each create a lesson           S2 a lesson is revised while another is added
#                 S3 an author creates a feature (own folder)   S4 a feature is revised while another is created
#                 S5 non-conforming lessons and features are rejected   S6 a clean copy, no artifact dependency
#               Each merges the authors' branches in BOTH orders and requires a byte-identical build.
#
# Run the same checks locally:  npm ci && npm run check && npm run build && npm test && npm run acceptance
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      audit:
        description: "Also run vcheck.js on EVERY lesson and print the seed inventory (reports legacy findings; does not block)"
        type: boolean
        default: false

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install (from the lockfile, so every author runs the same tools)
        run: npm ci

      - name: Contracts and the seed set (schemas, fixtures, storage paths, features, generated index)
        run: ./check.sh

      - name: Work out which lesson seeds changed
        id: changed
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE="${{ github.event.pull_request.base.sha }}"
          elif [ "${{ github.event_name }}" = "push" ]; then
            BASE="${{ github.event.before }}"
          else
            BASE=""
          fi
          if [ -n "$BASE" ] && git cat-file -e "$BASE" 2>/dev/null; then
            git diff --name-only --diff-filter=AM "$BASE" HEAD -- 'seed/lesson_*.json' > .changed.txt
          else
            : > .changed.txt
          fi
          echo "Changed lesson seeds:"; cat .changed.txt || true

      - name: House-standard check (vcheck.js) on the lessons this change touches
        run: |
          fail=0
          while read -r f; do
            [ -z "$f" ] && continue
            echo "::group::$f"
            out=$(node vcheck.js "$f" 2>&1) || rc=$?
            echo "$out" | grep -v '^seed/' || true
            if [ "${rc:-0}" -ne 0 ] || echo "$out" | grep -q "FAILURES"; then
              echo "::error file=$f::house-standard validation failed"; fail=1
            fi
            rc=0
            echo "::endgroup::"
          done < .changed.txt
          exit $fail

      - name: Audit every lesson and print the seed inventory (manual run only)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.audit }}
        continue-on-error: true
        run: |
          node tools/contract-audit.js
          for f in seed/lesson_*.json; do
            out=$(node vcheck.js "$f" 2>&1) || true
            if echo "$out" | grep -q "FAILURES"; then echo "::warning file=$f::$(echo "$out" | grep -A3 FAILURES | tr '\n' ' ')"; fi
          done

  browser:
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install (from the lockfile) and the browser
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Build the app and the hosted site
        run: npm run build
      - name: test.js (the app against the storage-path contract, in strict mode)
        run: node test.js
      - name: clicktest.js (every lesson starts and advances)
        run: node clicktest.js
      - name: Hosted storage adapter conformance
        run: node tests/hosted-shim.test.js
      - name: Every feature's own browser test
        run: node tests/features.test.js --verbose

  acceptance:
    # The owner's requirement as a command. It runs browser tests (scenarios 3 and 4 run the features' own tests),
    # so it needs the browser installed as well.
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install (from the lockfile) and the browser
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Independence acceptance test (six scenarios)
        run: node tools/acceptance.js
