name: Validate

# The gate for every author, human or model. A pull request cannot merge while this is red.
# Everything here is a documented command (see AGENTS.md); nothing depends on one author's tools, prompts or session.
# Run the same checks locally with:  npm ci && npm run check && npm run build && npm test && npm run acceptance
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      audit:
        description: "Also validate EVERY lesson with vcheck.js and print the seed inventory (reports legacy findings; does not block)"
        type: boolean
        default: false

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install (from the lockfile, so every author runs the same tools)
        run: npm ci

      - name: Contracts and the seed set (schemas, fixtures, storage paths, generated index)
        run: ./check.sh

      - name: Work out which lesson seeds changed
        id: changed
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE="${{ github.event.pull_request.base.sha }}"
          elif [ "${{ github.event_name }}" = "push" ]; then
            BASE="${{ github.event.before }}"
          else
            BASE=""
          fi
          if [ -n "$BASE" ] && git cat-file -e "$BASE" 2>/dev/null; then
            git diff --name-only --diff-filter=AM "$BASE" HEAD -- 'seed/lesson_*.json' > .changed.txt
          else
            : > .changed.txt
          fi
          echo "Changed lesson seeds:"; cat .changed.txt || true

      - name: House-standard check (vcheck.js) on the lessons this change touches
        run: |
          fail=0
          while read -r f; do
            [ -z "$f" ] && continue
            echo "::group::$f"
            out=$(node vcheck.js "$f" 2>&1) || rc=$?
            echo "$out" | grep -v '^seed/' || true
            if [ "${rc:-0}" -ne 0 ] || echo "$out" | grep -q "FAILURES"; then
              echo "::error file=$f::house-standard validation failed"; fail=1
            fi
            rc=0
            echo "::endgroup::"
          done < .changed.txt
          exit $fail

      - name: Audit every lesson and print the seed inventory (manual run only)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.audit }}
        continue-on-error: true
        run: |
          node tools/contract-audit.js
          for f in seed/lesson_*.json; do
            out=$(node vcheck.js "$f" 2>&1) || true
            if echo "$out" | grep -q "FAILURES"; then echo "::warning file=$f::$(echo "$out" | grep -A3 FAILURES | tr '\n' ' ')"; fi
          done

  browser:
    # The browser suites run after the fast checks pass.
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install (from the lockfile) and the browser
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Build the app and the hosted site
        run: npm run build
      - name: test.js (the app against the storage-path contract, in strict mode)
        run: node test.js
      - name: clicktest.js (every lesson starts and advances)
        run: node clicktest.js
      - name: Hosted storage adapter conformance
        run: node tests/hosted-shim.test.js
      - name: Every feature's own browser test
        run: node tests/features.test.js

  acceptance:
    # The owner's requirement as a command: two authors add lessons independently, merge in either order, same build.
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: npm ci
      - name: Independence acceptance test
        run: node tools/acceptance.js
