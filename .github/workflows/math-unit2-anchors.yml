name: Mathematics Unit II exact anchors
on:
  push:
    branches:
      - gpt/mathematics-unit2-production
    paths:
      - verify_math_unit2.py
      - .github/workflows/math-unit2-anchors.yml
  pull_request:
    paths:
      - verify_math_unit2.py
      - .github/workflows/math-unit2-anchors.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  exact-anchors:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Run exact anchor checks
        run: python verify_math_unit2.py
