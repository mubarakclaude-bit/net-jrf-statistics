name = "net-jrf-source-processor"
main = "src/index.js"
compatibility_date = "2026-11-20"

[[r2_buckets]]
binding = "SOURCE_BUCKET"
bucket_name = "net-jrf-private-source"

[[r2_buckets]]
binding = "ARTIFACT_BUCKET"
bucket_name = "net-jrf-private-artifacts"

